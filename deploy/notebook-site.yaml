AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lab notebook site. A private S3 bucket is read only by one CloudFront distribution
  (origin access control). A CloudFront Function serves index.html for folder URLs such as /body-lab/.
  Created and updated by scripts/publish-notebook.sh create.

Parameters:
  BucketName:
    Type: String
    Description: Name of the new private S3 bucket that holds the notebook files.
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: 3 to 63 characters, lowercase letters, digits, dots or hyphens, starting and ending with a letter or digit.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: Lets the notebook distribution read the private bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FolderIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-folder-index"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for folder URLs.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
            return request;
          }
          var last = uri.substring(uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') === -1) {
            var parts = [];
            var qs = request.querystring;
            Object.keys(qs).forEach(function (name) {
              var entry = qs[name];
              var values = entry.multiValue ? entry.multiValue.map(function (v) { return v.value; }) : [entry.value];
              values.forEach(function (value) {
                parts.push(encodeURIComponent(name) + '=' + encodeURIComponent(value));
              });
            });
            var location = uri + '/' + (parts.length ? '?' + parts.join('&') : '');
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: location } }
            };
          }
          return request;
        }

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: SiteBucketOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: SiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed policy CachingOptimized. Content changes are published with a CloudFront invalidation.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FolderIndexFunction.FunctionMetadata.FunctionARN

Outputs:
  BucketName:
    Description: S3 bucket that publish-notebook.sh syncs the site into.
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution ID, used for cache invalidation.
    Value: !Ref SiteDistribution
  DistributionDomainName:
    Description: Public host name of the notebook site.
    Value: !GetAtt SiteDistribution.DomainName
