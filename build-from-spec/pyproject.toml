[project]
name = "build-from-spec"
version = "0.1.0"
description = "build-from-spec: the reader answers a request from Dr. Kiro's spec, through the bench."
requires-python = ">=3.12,<3.13"
dependencies = [
    "lab-bench",
    "body-lab-adapter",
]

[project.scripts]
bfs-check-request = "build_from_spec.request:check_main"
bfs-run = "build_from_spec.run:main"
bfs-run-file = "build_from_spec.runfile:main"
bfs-check-runs = "build_from_spec.check:main"

[tool.uv.sources]
lab-bench = { path = "../bench", editable = true }
body-lab-adapter = { path = "../body-lab/adapter", editable = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "build_from_spec"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra", "--import-mode=importlib"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID", "BLE", "S110", "SIM"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
