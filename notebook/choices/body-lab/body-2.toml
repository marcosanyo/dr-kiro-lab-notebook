title = "The Reversed Wave"
subtitle = "a wave meant to walk forward went 0.20 m back"
summary = """Dr. Kiro predicted that a travelling wave over all five channels would carry the body more than 0.2 m forward. The experiment said otherwise: the body ended 0.20 m behind where it started, and turned. Over 39 trials, 13 of 24 predictions missed and 8 of the 14 rules in the table were struck out and rewritten. What held was simpler: one channel kept at a steady level while another was driven by a fast sine moved the body 0.75 m forward, the best of the session."""
line = "A wave that went the wrong way, and the rewrite that found 0.75 m."
model = "claude-sonnet-5.5"
date = "2026-11-16"
color = "violet"

[progress]
measurement = "x"
better = "higher"

[[polaroid]]
heading = "The miss"
trial = "T12"
words = "Predicted more than 0.2 m forward. It went back and turned."

[[polaroid]]
heading = "Best gait"
trial = "T36"
words = "A steady offset plus a fast stroke. Far past the first idea."
star = true
