[[lab]]
application = "body-lab"
case = "CASE 1 · THE STITCHED BODY (MUJOCO)"
about = """A body that Dr. Kiro has never seen and nobody has described. It can only send a signal into each of five unlabeled channels and watch where the body ends up and which way it faces. 40 trials of 5 seconds each."""
open = "body-2"
unit = "trials"

[[lab]]
application = "wind-tunnel"
case = "CASE 2 · THE WIND TUNNEL (OPENFOAM)"
about = """Air flows past a 2D body. Dr. Kiro turns four knobs (aspect, corner, splitter and angle) and reads drag, lift and whether the flow sheds vortices. 24 runs at most, and no description of the flow."""
open = "wt-004"
unit = "runs"
