symbols = """cd: drag, lower is less. cl_mean: average lift. cl_amp: how far the lift swings (near 0 is a calm wake). shedding: 1 while vortices peel off, 0 when the flow is calm. aspect: length over height. corner: 0 square, 1 fully rounded. splitter: the plate behind the body, 0 for none. angle: degrees the wind comes from."""
